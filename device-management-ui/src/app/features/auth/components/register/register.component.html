<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Register</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field class="full-width">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" />
          <mat-error *ngIf="form.get('name')?.hasError('required')"
            >Name is required</mat-error
          >
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" />
          <mat-error *ngIf="form.get('email')?.hasError('required')"
            >Email is required</mat-error
          >
          <mat-error *ngIf="form.get('email')?.hasError('email')"
            >Invalid email</mat-error
          >
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" type="password" />
          <mat-error *ngIf="form.get('password')?.hasError('required')"
            >Password is required</mat-error
          >
          <mat-error *ngIf="form.get('password')?.hasError('minlength')"
            >Minimum 6 characters</mat-error
          >
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>Role</mat-label>
          <input matInput formControlName="role" />
          <mat-error *ngIf="form.get('role')?.hasError('required')"
            >Role is required</mat-error
          >
        </mat-form-field>

        <mat-form-field class="full-width">
          <mat-label>Location</mat-label>
          <input matInput formControlName="location" />
          <mat-error *ngIf="form.get('location')?.hasError('required')"
            >Location is required</mat-error
          >
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="full-width"
          [disabled]="form.invalid"
        >
          Register
        </button>
      </form>
    </mat-card-content>
    <mat-card-footer>
      <p>Already have an account? <a routerLink="/auth/login">Login</a></p>
    </mat-card-footer>
  </mat-card>
</div>
